name: Publicar Gimnasio del Negociador en GitHub Pages

# Cada push a main copia el contenido a gh-pages y GitHub Pages se actualiza solo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copiar main a gh-pages
        run: git push --force origin HEAD:gh-pages
